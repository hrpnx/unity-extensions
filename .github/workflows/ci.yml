name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          dotnet restore Analyzers.csproj
          dotnet tool restore
          npm install

      - name: Lint
        run: npm run lint
        env:
          # editorconfig-checker の npm ラッパー 6 系は ec-* という名前のバイナリを探す。
          # 本体 4.0.0 でアセット名が変わり見つからなくなったため、対応する最後の 3 系に固定する。
          EC_VERSION: v3.11.3

      - name: Run dotnet format
        run: dotnet format Analyzers.csproj --verify-no-changes --verbosity diagnostic
