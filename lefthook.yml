commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    csharpier:
      glob: "*.cs"
      run: npm run lint:csharpier
    cspell:
      run: npm run lint:cspell
    editorconfig:
      run: npm run lint:editorconfig
      env:
        # ci.yml の Lint ステップと同じ理由で固定する
        EC_VERSION: v3.11.3
    secretlint:
      run: npm run lint:secretlint
